version: "3.8"

services:
  postgres:
    image: postgres:14
    container_name: upstairs-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: strapi_db
      POSTGRES_USER: strapi_user
      POSTGRES_PASSWORD: Up@123451

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
